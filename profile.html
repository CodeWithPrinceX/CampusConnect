<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampusConnect | Profile</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <header class="navbar">

        <a
            href="dashboard.html"
            class="nav-logo"
        >
            Campus<span>Connect</span>
        </a>


        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="create-issue.html">
                Create Issue
            </a>

            <a href="issue-details.html">
                Issues
            </a>

            <a
                href="profile.html"
                class="active"
            >
                Profile
            </a>

            <a
                href="index.html"
                class="logout"
            >
                Logout
            </a>

        </nav>

    </header>


    <main class="profile">


        <div class="profile-card">


            <div
                class="profile-avatar"
                id="profileAvatar"
            >
                U
            </div>


            <h1 id="profileName">
                Student
            </h1>


            <p>
                CampusConnect Student
            </p>


            <div class="profile-info">


                <div>

                    <span>
                        Full Name
                    </span>

                    <strong id="profileFullName">
                        Student
                    </strong>

                </div>


                <div>

                    <span>
                        Email
                    </span>

                    <strong id="profileEmail">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        Department
                    </span>

                    <strong id="profileDepartment">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        Role
                    </span>

                    <strong>
                        Student
                    </strong>

                </div>


            </div>


            <a
                href="dashboard.html"
                class="gradient-btn profile-btn"
            >
                ← Back to Dashboard
            </a>


        </div>


    </main>


    <script src="js/script.js"></script>

</body>

</html>
