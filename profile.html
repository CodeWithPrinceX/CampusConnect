<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampusConnect | Profile</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <header class="navbar">

        <a
            href="dashboard.html"
            class="nav-logo"
        >
            Campus<span>Connect</span>
        </a>


        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="create-issue.html">
                Create Issue
            </a>

            <a href="issue-details.html">
                Issues
            </a>

            <a
                href="profile.html"
                class="active"
            >
                Profile
            </a>

            <a
                href="index.html"
                class="logout"
                id="logoutButton"
            >
                Logout
            </a>

        </nav>

    </header>


    <main class="profile-page">

        <a
            href="dashboard.html"
            class="back-link"
        >
            ← Back to Dashboard
        </a>

        <div class="profile-card">

            <div class="profile-header">
                <div
                    class="profile-avatar"
                    id="profileAvatar"
                >
                    U
                </div>

                <div class="profile-title-area">
                    <h1 id="profileName">
                        Student
                    </h1>
                    <p class="profile-subtitle">
                        CampusConnect Student Account
                    </p>
                </div>
            </div>

            <div class="profile-content">
                <h3 class="profile-section-title">
                    Account Details
                </h3>

                <div class="profile-grid">
                    <div class="profile-field">
                        <span>Full Name</span>
                        <strong id="profileFullName">Student</strong>
                    </div>

                    <div class="profile-field">
                        <span>Email Address</span>
                        <strong id="profileEmail">-</strong>
                    </div>

                    <div class="profile-field">
                        <span>Department</span>
                        <strong id="profileDepartment">-</strong>
                    </div>

                    <div class="profile-field">
                        <span>Role</span>
                        <strong id="profileRole">Student</strong>
                    </div>

                    <div class="profile-field full-width">
                        <span>Total Issues Reported</span>
                        <strong id="profileIssues">0</strong>
                    </div>
                </div>

                <div id="profileError" class="profile-error" style="display: none;"></div>
            </div>

        </div>

    </main>


    <script src="css/js/script.js"></script>

</body>

</html>
