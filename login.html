<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusConnect | Login</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body class="auth-body">

<header class="navbar">

    <div class="logo">
        <span>Campus</span>Connect
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="create-account.html" class="nav-signup">
            Create Account
        </a>
    </nav>

</header>


<main class="auth-container">

    <div class="auth-card login-card">

        <div class="auth-heading">

            <p class="small-heading">WELCOME BACK</p>

            <h1>Login to your account</h1>

            <p>
                Access your CampusConnect dashboard.
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div id="loginMessage" class="form-message"></div>


            <button
                type="submit"
                class="btn primary-btn full-btn"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">
            Don't have an account?
            <a href="create-account.html">Create one</a>
        </p>

    </div>

</main>


<script src="JavaScript/script.js"></script>

</body>
</html>
